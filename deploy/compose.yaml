name: mgar-v2-dev
services:
  postgres:
    image: postgres:16.11-bookworm@sha256:a2420e9555e2224583fe84d0bb3f0b967e69354ae3a0be55a9c14e251388c4eb
    environment:
      POSTGRES_USER: mgar_test_admin
      POSTGRES_PASSWORD: ${MGAR_TEST_DB_PASSWORD:?use local generated test credentials}
      POSTGRES_DB: mgar_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - mgar_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mgar_test_admin -d mgar_test"]
      interval: 1s
      timeout: 3s
      retries: 40
    networks: [testonly]
networks:
  testonly:
    internal: true
volumes:
  mgar_test_data:
