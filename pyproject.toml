[project]
name = "mgar-agents"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema==4.25.1",
    "psycopg[binary]==3.2.10",
    "sqlglot==27.14.0",
]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["agentkit"]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "ruff==0.14.3",
    "mypy==1.19.1",
    "types-jsonschema==4.25.1.20251009",
    "matplotlib==3.10.7",
]

[tool.pytest.ini_options]
testpaths = ["tests", "eval/context_selection", "eval/scheduling"]
xfail_strict = true

[tool.mypy]
files = ["agentkit"]
strict = true

[tool.ruff]
include = ["agentkit/**/*.py", "tests/test_provider.py", "tests/test_claim.py", "tests/test_pipeline.py", "tests/unit/**/*.py", "tests/security/**/*.py", "tests/e2e/*.py", "eval/context_selection/**/*.py", "eval/scheduling/**/*.py", "eval/oracle/**/*.py", "eval/analysis/**/*.py", "eval/load/**/*.py", "eval/live/**/*.py"]
